<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-label="Animated terminal introduction for Rahul Takale">
  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <clipPath id="type1">
      <rect x="92" y="122" width="0" height="34">
        <animate attributeName="width"
          values="0;290;290;0"
          keyTimes="0;0.10;0.88;1"
          dur="10s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="type2">
      <rect x="92" y="204" width="0" height="34">
        <animate attributeName="width"
          values="0;0;250;250;0"
          keyTimes="0;0.20;0.28;0.88;1"
          dur="10s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="type3">
      <rect x="92" y="438" width="0" height="34">
        <animate attributeName="width"
          values="0;0;235;235;0"
          keyTimes="0;0.50;0.58;0.88;1"
          dur="10s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "Fira Code", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #e5e7eb; }
    .prompt { font-size: 22px; font-weight: 700; fill: #facc15; }
    .command { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .output { font-size: 19px; fill: #c4b5fd; }
    .json-key { fill: #7dd3fc; }
    .json-value { fill: #86efac; }
    .cursor { fill: #fb7185; animation: blink .75s steps(1) infinite; }

    .cmd1 { opacity: 0; animation: cmd1 10s linear infinite; }
    .out1 { opacity: 0; animation: out1 10s linear infinite; }
    .cmd2 { opacity: 0; animation: cmd2 10s linear infinite; }
    .out2 { opacity: 0; animation: out2 10s linear infinite; }
    .cmd3 { opacity: 0; animation: cmd3 10s linear infinite; }
    .out3 { opacity: 0; animation: out3 10s linear infinite; }
    .finalCursor { opacity: 0; animation: finalCursor 10s linear infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes cmd1 {
      0%, 3% { opacity: 0; }
      5%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes out1 {
      0%, 11% { opacity: 0; }
      14%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes cmd2 {
      0%, 20% { opacity: 0; }
      22%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes out2 {
      0%, 29% { opacity: 0; }
      32%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes cmd3 {
      0%, 50% { opacity: 0; }
      52%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes out3 {
      0%, 59% { opacity: 0; }
      62%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }

    @keyframes finalCursor {
      0%, 76% { opacity: 0; }
      79%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
  </style>

  <rect x="20" y="20" width="1060" height="660" rx="18" fill="url(#terminalBg)" stroke="#334155" stroke-width="2"/>

  <rect x="20" y="20" width="1060" height="62" rx="18" fill="#161b22"/>
  <rect x="20" y="62" width="1060" height="20" fill="#161b22"/>

  <circle cx="56" cy="51" r="9" fill="#ff5f57"/>
  <circle cx="84" cy="51" r="9" fill="#febc2e"/>
  <circle cx="112" cy="51" r="9" fill="#28c840"/>

  <text x="145" y="58" class="mono title">rahul@portfolio: ~</text>

  <rect x="938" y="35" width="106" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="958" y="57" class="mono title" font-size="14">TERMINAL</text>

  <g class="mono">

    <!-- Command 1 -->
    <g class="cmd1">
      <text x="64" y="145" class="prompt">$</text>
      <text x="92" y="145" class="command" clip-path="url(#type1)">npx rahul-takale</text>
    </g>

    <g class="out1">
      <text x="64" y="185" class="output">&gt; Initializing Rahul Takale...</text>
    </g>

    <!-- Command 2 -->
    <g class="cmd2">
      <text x="64" y="227" class="prompt">$</text>
      <text x="92" y="227" class="command" clip-path="url(#type2)">cat profile.json</text>
    </g>

    <g class="out2">
      <text x="64" y="274" class="output">{</text>
      <text x="92" y="312" class="output json-key">"name": <tspan class="json-value">"Rahul Takale"</tspan>,</text>
      <text x="92" y="350" class="output json-key">"role": <tspan class="json-value">"AI Engineer &amp; Backend Developer"</tspan>,</text>
      <text x="92" y="388" class="output json-key">"education": <tspan class="json-value">"B.Tech CSE, MIT ADT University"</tspan></text>
      <text x="64" y="426" class="output">}</text>
    </g>

    <!-- Command 3 -->
    <g class="cmd3">
      <text x="64" y="461" class="prompt">$</text>
      <text x="92" y="461" class="command" clip-path="url(#type3)">cat skills.json</text>
    </g>

    <g class="out3">
      <text x="64" y="508" class="output">{</text>
      <text x="92" y="546" class="output json-key">"languages": <tspan class="json-value">["Java", "Python", "JavaScript", "C++"]</tspan>,</text>
      <text x="92" y="584" class="output json-key">"backend": <tspan class="json-value">["Spring Boot", "FastAPI", "Node.js"]</tspan>,</text>
      <text x="92" y="622" class="output json-key">"ai_ml": <tspan class="json-value">["LLMs", "RAG", "LangChain", "Transformers"]</tspan></text>
      <text x="64" y="650" class="output">}</text>
    </g>

    <!-- Final prompt with bottom breathing space -->
    <g class="finalCursor">
      <text x="64" y="662" class="prompt">$</text>
      <rect x="92" y="640" width="14" height="27" rx="1" class="cursor"/>
    </g>

  </g>
</svg>