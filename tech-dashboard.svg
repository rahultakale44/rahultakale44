<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570">
<style>
text{font-family:"Fira Code","Cascadia Code",Consolas,monospace}.h{fill:#f8fafc;font-size:23px;font-weight:700}.s{fill:#94a3b8;font-size:15px}.k{fill:#7dd3fc;font-size:17px;font-weight:700}.v{fill:#e2e8f0;font-size:16px}
.card{fill:#161b22;stroke:#30363d;stroke-width:2}.chip{fill:#0d1117;stroke:#334155}.scan{fill:#2ea043;opacity:.13;animation:scan 4s linear infinite}
.row{opacity:.35;animation:light 5s infinite}.r2{animation-delay:1s}.r3{animation-delay:2s}.r4{animation-delay:3s}.r5{animation-delay:4s}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(455px)}}@keyframes light{0%,16%{opacity:1}20%,100%{opacity:.35}}
</style>
<rect x="15" y="15" width="1070" height="540" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="15" y="15" width="1070" height="60" rx="18" fill="#161b22"/><text x="45" y="52" class="h">RAHUL OS — TECH ARSENAL</text>
<rect x="40" y="100" width="1020" height="420" rx="16" class="card"/><rect x="40" y="100" width="1020" height="4" class="scan"/>
<g class="row"><text x="75" y="155" class="k">LANGUAGES</text><text x="280" y="155" class="v">Java   Python   JavaScript   C++   R</text></g>
<line x1="70" y1="180" x2="1030" y2="180" stroke="#21262d"/>
<g class="row r2"><text x="75" y="225" class="k">BACKEND</text><text x="280" y="225" class="v">Spring Boot   FastAPI   Node.js   Express   REST APIs</text></g>
<line x1="70" y1="250" x2="1030" y2="250" stroke="#21262d"/>
<g class="row r3"><text x="75" y="295" class="k">AI / GENAI</text><text x="280" y="295" class="v">LLMs   RAG   LangChain   Transformers   Computer Vision</text></g>
<line x1="70" y1="320" x2="1030" y2="320" stroke="#21262d"/>
<g class="row r4"><text x="75" y="365" class="k">DATA</text><text x="280" y="365" class="v">MySQL   PostgreSQL   MongoDB   Qdrant   Firebase</text></g>
<line x1="70" y1="390" x2="1030" y2="390" stroke="#21262d"/>
<g class="row r5"><text x="75" y="435" class="k">DEVOPS</text><text x="280" y="435" class="v">AWS   Docker   Linux   GitHub Actions   Postman</text></g>
<text x="75" y="490" class="s">system.status = "learning continuously";</text>
</svg>