<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="Animated terminal introduction for Rahul Takale">
  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="clip1"><rect x="64" y="124" width="0" height="28"><animate attributeName="width" values="0;610;610;0" keyTimes="0;0.10;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="64" y="196" width="0" height="28"><animate attributeName="width" values="0;530;530;0" keyTimes="0;0.18;0.94;1" dur="18s" begin="2.2s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="64" y="360" width="0" height="28"><animate attributeName="width" values="0;560;560;0" keyTimes="0;0.18;0.94;1" dur="18s" begin="6.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="64" y="578" width="0" height="28"><animate attributeName="width" values="0;720;720;0" keyTimes="0;0.18;0.94;1" dur="18s" begin="12.3s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: "Fira Code", "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #e5e7eb; }
    .prompt { font-size: 22px; font-weight: 700; fill: #facc15; }
    .command { font-size: 22px; font-weight: 700; fill: #f8fafc; }
    .output { font-size: 20px; fill: #c4b5fd; }
    .json-key { fill: #7dd3fc; }
    .json-value { fill: #86efac; }
    .muted { fill: #94a3b8; }
    .green { fill: #4ade80; }
    .cursor { fill: #fb7185; animation: blink 0.85s steps(1) infinite; }
    .fade1 { opacity: 0; animation: show 18s linear infinite; }
    .fade2 { opacity: 0; animation: show2 18s linear infinite; }
    .fade3 { opacity: 0; animation: show3 18s linear infinite; }
    .fade4 { opacity: 0; animation: show4 18s linear infinite; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes show  { 0%, 11% { opacity: 0; } 14%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show2 { 0%, 26% { opacity: 0; } 29%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show3 { 0%, 54% { opacity: 0; } 57%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes show4 { 0%, 82% { opacity: 0; } 85%, 94% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect x="20" y="20" width="1060" height="720" rx="18" fill="url(#terminalBg)" filter="url(#shadow)" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="20" width="1060" height="62" rx="18" fill="#161b22"/>
  <rect x="20" y="62" width="1060" height="20" fill="#161b22"/>

  <circle cx="56" cy="51" r="9" fill="#ff5f57"/>
  <circle cx="84" cy="51" r="9" fill="#febc2e"/>
  <circle cx="112" cy="51" r="9" fill="#28c840"/>
  <text x="145" y="58" class="mono title">rahul@portfolio: ~</text>
  <rect x="938" y="35" width="106" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="958" y="57" class="mono title" font-size="14">TERMINAL</text>

  <g class="mono">
    <text x="64" y="145" class="prompt">$</text>
    <text x="92" y="145" class="command" clip-path="url(#clip1)">npx rahul-takale</text>

    <g class="fade1">
      <text x="64" y="183" class="output">&gt; Initializing Rahul Takale...</text>
    </g>

    <text x="64" y="217" class="prompt">$</text>
    <text x="92" y="217" class="command" clip-path="url(#clip2)">cat profile.json</text>

    <g class="fade2">
      <text x="64" y="255" class="output">{</text>
      <text x="92" y="289" class="output json-key">"name": <tspan class="json-value">"Rahul Takale"</tspan>,</text>
      <text x="92" y="323" class="output json-key">"role": <tspan class="json-value">"AI Engineer &amp; Backend Developer"</tspan>,</text>
      <text x="92" y="357" class="output json-key">"education": <tspan class="json-value">"B.Tech CSE, MIT ADT University"</tspan></text>
      <text x="64" y="391" class="output">}</text>
    </g>

    <text x="64" y="381" class="prompt">$</text>
    <text x="92" y="381" class="command" clip-path="url(#clip3)">cat skills.json</text>

    <g class="fade3">
      <text x="64" y="425" class="output">{</text>
      <text x="92" y="459" class="output json-key">"languages": <tspan class="json-value">["Java", "Python", "JavaScript", "C++"]</tspan>,</text>
      <text x="92" y="493" class="output json-key">"backend": <tspan class="json-value">["Spring Boot", "FastAPI", "Node.js"]</tspan>,</text>
      <text x="92" y="527" class="output json-key">"ai_ml": <tspan class="json-value">["LLMs", "RAG", "LangChain", "Transformers"]</tspan>,</text>
      <text x="92" y="561" class="output json-key">"cloud": <tspan class="json-value">["AWS", "Docker", "GitHub Actions"]</tspan></text>
      <text x="64" y="595" class="output">}</text>
    </g>

    <text x="64" y="599" class="prompt">$</text>
    <text x="92" y="599" class="command" clip-path="url(#clip4)">echo "LET'S BUILD SOMETHING IMPACTFUL"</text>

    <g class="fade4">
      <text x="64" y="647" class="output green">LET'S BUILD SOMETHING IMPACTFUL 🚀</text>
      <text x="64" y="699" class="prompt">$</text>
      <rect x="92" y="677" width="14" height="27" rx="1" class="cursor"/>
    </g>
  </g>
</svg>
